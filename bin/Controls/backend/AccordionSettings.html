<form name="quiqqer-bricks-accordion-settings-entry"
      class="quiqqer-bricks-accordion-settings-entry-form"
>
    <table class="data-table data-table-flexbox">
        <tbody>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{disabled}}
                    </span>
                    <span id="disabledWrapper" class="field-container-field"></span>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{title}}
                    </span>
                    <input type="text" name="entryTitle" class="field-container-field"/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{anchor}}
                    </span>
                    <input type="text" name="anchor" class="field-container-field"
                           aria-describedby="{{idPrefix}}-anchor-description"/>
                </label>
                <div class="field-container-item-desc" id="{{idPrefix}}-anchor-description">
                    {{anchorDescription}}
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{content}}
                    </span>
                    <input name="entryContent" class="field-container-field field-entryContent"
                           data-qui="controls/editors/Input"/>
                </label>
            </td>
        </tr>
        </tbody>
    </table>
</form>
